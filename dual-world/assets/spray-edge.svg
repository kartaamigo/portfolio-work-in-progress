<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1000" viewBox="0 0 3000 1000">
 <defs>
  <linearGradient id="paint" x1="0" x2="1">
   <stop offset="0" stop-color="white"/><stop offset=".52" stop-color="white"/>
   <stop offset=".66" stop-color="white" stop-opacity=".85"/>
   <stop offset=".82" stop-color="white" stop-opacity=".18"/>
   <stop offset="1" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <filter id="aerosol" x="-10%" y="-20%" width="130%" height="140%">
   <feTurbulence type="fractalNoise" baseFrequency=".013 .021" numOctaves="3" seed="12" result="grain"/>
   <feDisplacementMap in="SourceGraphic" in2="grain" scale="135" xChannelSelector="R" yChannelSelector="G"/>
   <feGaussianBlur stdDeviation="7"/>
  </filter>
 </defs>
 <rect x="-100" y="-200" width="2300" height="1400" fill="url(#paint)" filter="url(#aerosol)"/>
 <g fill="white" opacity=".17">
  <circle cx="2120" cy="92" r="5"/><circle cx="2040" cy="210" r="9"/>
  <circle cx="2190" cy="340" r="3"/><circle cx="2105" cy="440" r="6"/>
  <circle cx="2150" cy="610" r="4"/><circle cx="2020" cy="725" r="8"/>
  <circle cx="2180" cy="850" r="3"/><circle cx="2090" cy="960" r="6"/>
 </g>
</svg>
